name: Nightly

# Refresh the nightly website and build + publish the nightly desktop apps once a
# day at midnight America/Toronto. GitHub cron is UTC and can't follow DST, so we
# fire at both 04:00 (EDT) and 05:00 (EST) UTC and gate on the real Toronto hour,
# which lands exactly one run at local midnight year-round. Use the "Run workflow"
# button (workflow_dispatch) to trigger an off-schedule nightly anytime.
on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write # electron-builder publishes GitHub releases via GITHUB_TOKEN

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=America/Toronto date +%H)" = "00" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Not midnight in Toronto ($(TZ=America/Toronto date)); skipping this run."
          fi
          # Nightly version: <base>-nightly.<YYYYMMDD in Toronto>. Monotonic by date,
          # and the `-nightly` prerelease makes electron-builder publish to the
          # 'nightly' update channel.
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          DATE=$(TZ=America/Toronto date +%Y%m%d)
          echo "version=${BASE}-nightly.${DATE}" >> "$GITHUB_OUTPUT"

  # Rebuild the nightly website from the latest commit by pinging its Render
  # Deploy Hook (create it under the gentoo-web-nightly service → Settings, and
  # store the URL as the RENDER_NIGHTLY_DEPLOY_HOOK repo secret).
  web:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger nightly website deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_NIGHTLY_DEPLOY_HOOK }}"

  desktop-mac:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: macos-latest
    env:
      # Baked into the web bundle that the desktop app ships.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GROQ_API_KEY: ${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}
      EXPO_PUBLIC_COMMIT_SHA: ${{ github.sha }}
      # Code signing + notarization — electron-builder reads these automatically.
      # MAC_CSC_LINK = base64 of your Developer ID Application .p12.
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run export:web
      - name: Build, sign, notarize & publish nightly DMG
        run: |
          npx electron-builder --mac dmg --arm64 \
            --config electron-builder.json \
            -c.extraMetadata.version="${{ needs.gate.outputs.version }}" \
            -c.appId=com.gentoo.app.nightly \
            -c.productName="Gentoo Nightly" \
            -c.mac.notarize=true \
            --publish always

  desktop-win:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GROQ_API_KEY: ${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}
      EXPO_PUBLIC_COMMIT_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run export:web
      - name: Build & publish nightly Windows installer
        run: |
          npx electron-builder --win nsis --x64 \
            --config electron-builder.json \
            -c.extraMetadata.version="${{ needs.gate.outputs.version }}" \
            -c.appId=com.gentoo.app.nightly \
            -c.productName="Gentoo Nightly" \
            --publish always
