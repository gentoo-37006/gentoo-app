# Render blueprint — deploys the Expo web export as a static site.
# Render → New → Blueprint → connect this repo. Enter the EXPO_PUBLIC_* values
# (sync: false) when prompted; they are baked into the web bundle at build time.
services:
  # Production site. Does NOT redeploy on every push — deploy manually from the
  # Render dashboard when you want to cut a release.
  - type: web
    name: gentoo-web
    runtime: static
    autoDeploy: false
    buildCommand: npm ci && npm run export:web
    staticPublishPath: dist
    # version.json drives the in-app update banner; never cache it so the client
    # notices new deploys promptly.
    headers:
      - path: /app/version.json
        name: Cache-Control
        value: no-store
      # Universal Links: Apple fetches this extensionless file and REQUIRES
      # application/json. Without the override Render serves it as
      # octet-stream and iOS silently declines to associate the domain, so
      # scanned QR codes keep opening Safari instead of the app.
      - path: /.well-known/apple-app-site-association
        name: Content-Type
        value: application/json
    # The public website owns /. Only /app has the Expo SPA fallback.
    routes:
      - type: rewrite
        source: /app
        destination: /app/index.html
      - type: rewrite
        source: /app/*
        destination: /app/index.html
      # Scouting cards for alliance partners. One static page serves every card
      # and reads the partner's team number from the path.
      - type: rewrite
        source: /allianceinfo/*
        destination: /allianceinfo/index.html
      - type: redirect
        source: /sign-in
        destination: /app/sign-in
      - type: redirect
        source: /pending
        destination: /app/pending
      - type: redirect
        source: /downloads
        destination: /app/downloads
      - type: redirect
        source: /projects
        destination: /app/projects
      - type: redirect
        source: /projects/*
        destination: /app/projects/*
      - type: redirect
        source: /inventory
        destination: /app/inventory
      - type: redirect
        source: /inventory/*
        destination: /app/inventory/*
      - type: redirect
        source: /competition
        destination: /app/competition
      - type: redirect
        source: /scouting
        destination: /app/scouting
      - type: redirect
        source: /scouting/*
        destination: /app/scouting/*
      - type: redirect
        source: /picklist
        destination: /app/picklist
      - type: redirect
        source: /talkie
        destination: /app/talkie
      - type: redirect
        source: /schedule
        destination: /app/schedule
      - type: redirect
        source: /driver-station
        destination: /app/driver-station
      - type: redirect
        source: /notifications
        destination: /app/notifications
      - type: redirect
        source: /settings
        destination: /app/settings
      - type: redirect
        source: /admin
        destination: /app/admin
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: EXPO_PUBLIC_GROQ_API_KEY
        sync: false

  # Beta site. Same build as production and uses the SAME production env values
  # (incl. the production Supabase database) — enter the production EXPO_PUBLIC_*
  # values here when prompted. Does NOT auto-deploy on push; deploy it manually
  # from the Render dashboard whenever you want to push a beta build.
  - type: web
    name: gentoo-web-beta
    runtime: static
    autoDeploy: false
    # Bake the deployed commit SHA into the bundle (RENDER_GIT_COMMIT is provided
    # by Render at build time) so the update banner can detect new commits.
    # Exported (not inlined) so the write-version script picks up the same SHA
    # the bundle baked in.
    # --clear forces a cold Metro build so the commit SHA (and thus the build id)
    # is re-baked every deploy; otherwise the transform cache could reuse a stale
    # SHA and the update banner would fire forever.
    buildCommand: npm ci && export EXPO_PUBLIC_RELEASE_CHANNEL=beta && export EXPO_PUBLIC_COMMIT_SHA="$RENDER_GIT_COMMIT" && npm run export:web
    staticPublishPath: dist
    headers:
      - path: /app/version.json
        name: Cache-Control
        value: no-store
      # Universal Links: Apple fetches this extensionless file and REQUIRES
      # application/json. Without the override Render serves it as
      # octet-stream and iOS silently declines to associate the domain, so
      # scanned QR codes keep opening Safari instead of the app.
      - path: /.well-known/apple-app-site-association
        name: Content-Type
        value: application/json
    domains:
      - beta.gentoo.ethanyanxu.com
    routes:
      - type: rewrite
        source: /app
        destination: /app/index.html
      - type: rewrite
        source: /app/*
        destination: /app/index.html
      # Scouting cards for alliance partners. One static page serves every card
      # and reads the partner's team number from the path.
      - type: rewrite
        source: /allianceinfo/*
        destination: /allianceinfo/index.html
      - type: redirect
        source: /sign-in
        destination: /app/sign-in
      - type: redirect
        source: /pending
        destination: /app/pending
      - type: redirect
        source: /downloads
        destination: /app/downloads
      - type: redirect
        source: /projects
        destination: /app/projects
      - type: redirect
        source: /projects/*
        destination: /app/projects/*
      - type: redirect
        source: /inventory
        destination: /app/inventory
      - type: redirect
        source: /inventory/*
        destination: /app/inventory/*
      - type: redirect
        source: /competition
        destination: /app/competition
      - type: redirect
        source: /scouting
        destination: /app/scouting
      - type: redirect
        source: /scouting/*
        destination: /app/scouting/*
      - type: redirect
        source: /picklist
        destination: /app/picklist
      - type: redirect
        source: /talkie
        destination: /app/talkie
      - type: redirect
        source: /schedule
        destination: /app/schedule
      - type: redirect
        source: /driver-station
        destination: /app/driver-station
      - type: redirect
        source: /notifications
        destination: /app/notifications
      - type: redirect
        source: /settings
        destination: /app/settings
      - type: redirect
        source: /admin
        destination: /app/admin
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: EXPO_PUBLIC_GROQ_API_KEY
        sync: false
      - key: EXPO_PUBLIC_RELEASE_CHANNEL
        value: beta
