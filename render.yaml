# Render blueprint — deploys the Expo web export as a static site.
# Render → New → Blueprint → connect this repo. Enter the EXPO_PUBLIC_* values
# (sync: false) when prompted; they are baked into the web bundle at build time.
services:
  # Production site. Does NOT redeploy on every push — deploy manually from the
  # Render dashboard when you want to cut a release.
  - type: web
    name: gentoo-web
    runtime: static
    autoDeploy: false
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    # SPA fallback so client-side routes (incl. /tasks/[projectId],
    # /scouting/pit/[teamId], /scouting/matches/[matchId]) resolve to the app.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: EXPO_PUBLIC_GROQ_API_KEY
        sync: false

  # Beta site. Same build as production but auto-deploys on every push, so it
  # gets updates faster. Uses the SAME production env values (incl. the
  # production Supabase database) — enter the production EXPO_PUBLIC_* values
  # here when prompted.
  - type: web
    name: gentoo-web-beta
    runtime: static
    autoDeploy: true
    # Bake the deployed commit SHA into the bundle (RENDER_GIT_COMMIT is provided
    # by Render at build time) so the About screen can show "Commit <sha>".
    buildCommand: npm ci && EXPO_PUBLIC_COMMIT_SHA="$RENDER_GIT_COMMIT" npx expo export --platform web
    staticPublishPath: dist
    domains:
      - beta.gentoo.ethanyanxu.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: EXPO_PUBLIC_GROQ_API_KEY
        sync: false
