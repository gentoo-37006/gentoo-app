# Render blueprint — deploys the Expo web export as a static site.
# Render → New → Blueprint → connect this repo. Enter the EXPO_PUBLIC_* values
# (sync: false) when prompted; they are baked into the web bundle at build time.
services:
  # Production site. Does NOT redeploy on every push — deploy manually from the
  # Render dashboard when you want to cut a release.
  - type: web
    name: gentoo-web
    runtime: static
    autoDeploy: false
    buildCommand: npm ci && npx expo export --platform web --clear && node scripts/write-version.js
    staticPublishPath: dist
    # version.json drives the in-app update banner; never cache it so the client
    # notices new deploys promptly.
    headers:
      - path: /version.json
        name: Cache-Control
        value: no-store
    # SPA fallback so client-side routes (incl. /tasks/[projectId],
    # /scouting/pit/[teamId], /scouting/matches/[matchId]) resolve to the app.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: EXPO_PUBLIC_GROQ_API_KEY
        sync: false

  # Nightly site. Same build as production and uses the SAME production env values
  # (incl. the production Supabase database) — enter the production EXPO_PUBLIC_*
  # values here when prompted. Does NOT auto-deploy on push; the nightly GitHub
  # Actions workflow (.github/workflows/nightly.yml) POSTs this service's Render
  # Deploy Hook at midnight America/Toronto to rebuild from the latest commit.
  - type: web
    name: gentoo-web-nightly
    runtime: static
    autoDeploy: false
    # Bake the deployed commit SHA into the bundle (RENDER_GIT_COMMIT is provided
    # by Render at build time) so the About screen can show "Commit <sha>" and the
    # update banner can detect new commits. Exported (not inlined) so the
    # write-version script picks up the same SHA the bundle baked in.
    # --clear forces a cold Metro build so the commit SHA (and thus the build id)
    # is re-baked every deploy; otherwise the transform cache could reuse a stale
    # SHA and the update banner would fire forever.
    buildCommand: npm ci && export EXPO_PUBLIC_COMMIT_SHA="$RENDER_GIT_COMMIT" && npx expo export --platform web --clear && node scripts/write-version.js
    staticPublishPath: dist
    headers:
      - path: /version.json
        name: Cache-Control
        value: no-store
    domains:
      - nightly.gentoo.ethanyanxu.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: EXPO_PUBLIC_GROQ_API_KEY
        sync: false
