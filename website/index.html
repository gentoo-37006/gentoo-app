<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Gentoo Robotics. FIRST Tech Challenge Team 37006. Meet our sponsors and access the team app." />
    <title>Gentoo Robotics</title>
    <link rel="icon" type="image/png" href="/assets/gentoo-mark.png" />
    <link rel="apple-touch-icon" href="/assets/gentoo-mark.png" />
    <style>
      :root { color-scheme: light; --ink: #352d3f; --purple: #79599c; --lilac: #cbb0ed; --yellow: #ffe68b; --paper: #f0eaf3; }
      * { box-sizing: border-box; letter-spacing: 0; }
      /* The canvas exposed by overscroll matches the nearest page edge. */
      html { background: linear-gradient(to bottom, var(--yellow) 50%, var(--ink) 50%) fixed; color: var(--ink); scroll-behavior: smooth; }
      body { margin: 0; min-height: 100svh; background: var(--paper); font-family: 'Trebuchet MS', Arial, sans-serif; border-top: 6px solid var(--yellow); isolation: isolate; }
      body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: url('/assets/forest-background.png') center / cover no-repeat; opacity: 0.35; pointer-events: none; }
      a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 5px; }
      a:hover { color: var(--purple); }
      a:focus-visible { outline: 3px solid var(--purple); outline-offset: 6px; }
      .container { width: min(100% - 48px, 1100px); margin-inline: auto; }
      header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; padding-block: 23px; }
      .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; text-decoration: none; white-space: nowrap; }
      .brand-icon { width: 44px; height: 44px; flex: none; object-fit: contain; }
      nav { display: flex; align-items: center; gap: 30px; margin-left: auto; font-size: 14px; font-weight: 700; }
      .hero { min-height: min(760px, 76svh); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 24px 64px; text-align: center; }
      .team-wordmark { display: block; width: min(100%, 780px); margin: 0; }
      .team-wordmark img { display: block; width: 100%; height: auto; }
      .team-number { margin: 27px 0 9px; font: bold 22px/1.5 ui-monospace, monospace; }
      .sponsors { background: #e8dcf3; color: var(--ink); border-top: 6px solid var(--lilac); padding: 49px 0 64px; text-align: center; }
      .sponsors h2 { margin: 0 0 12px; font-size: 29px; }
      .sponsor-list { list-style: none; padding: 0; margin: 36px auto 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 24px 36px; max-width: 940px; }
      .sponsor-list li { flex: 0 1 260px; min-width: 0; }
      .sponsor-list a { display: flex; align-items: center; justify-content: center; height: 156px; }
      .sponsor-list img { display: block; max-width: 240px; width: 100%; height: 110px; object-fit: contain; }
      .sponsor-list .sponsor-symbol { width: 112px; height: 112px; }
      .sponsor-list .sponsor-sticker { width: 185px; height: 118px; }
      .sponsor-list .sponsor-panera { width: 174px; height: 130px; }
      footer { background: var(--ink); color: #d9cce6; }
      .footer-inner { border-top: 1px solid #665475; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 18px; padding-block: 24px; font-size: 13px; }
      .footer-links { display: flex; gap: 24px; flex-wrap: wrap; }
      .contact-link { display: inline-flex; align-items: center; gap: 5px; }
      .contact-icon { width: 16px; height: 16px; flex: none; }
      footer a:hover { color: var(--yellow); }
      @media (max-width: 600px) {
        .container { width: calc(100% - 36px); }
        header { gap: 16px; padding-block: 20px; }
        .brand { font-size: 15px; }
        .brand-icon { width: 34px; height: 34px; }
        nav { gap: 18px; font-size: 13px; }
        .hero { min-height: min(650px, 75svh); padding: 24px 18px 48px; }
        .sponsors { padding-block: 37px 46px; }
        .sponsor-list { gap: 12px 20px; margin-top: 24px; }
        .sponsor-list li { flex-basis: 240px; }
      }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    </style>
  </head>
  <body>
    <header class="container">
      <a class="brand" href="/" aria-label="Gentoo Robotics home">
        <img class="brand-icon" src="/assets/gentoo-mark.png" alt="" width="44" height="44" />
        <span>Gentoo Robotics</span>
      </a>
      <nav aria-label="Main navigation"><a href="#sponsors">Sponsors</a><a href="/app">Team App</a></nav>
    </header>
    <main id="main">
      <section class="hero" aria-labelledby="team-name">
        <h1 class="team-wordmark" id="team-name" aria-label="Gentoo Robotics">
          <img src="/assets/gentoo-wordmark.png" alt="" width="2159" height="1005" fetchpriority="high" />
        </h1>
        <p class="team-number">FTC Team 37006</p>
      </section>
      <section class="sponsors" id="sponsors" aria-labelledby="sponsors-title">
        <div class="container">
          <h2 id="sponsors-title">Our sponsors</h2>
          <ul class="sponsor-list" aria-label="Team sponsors">
            <li><a href="https://www.stickergiant.com/" target="_blank" rel="noopener noreferrer"><img class="sponsor-sticker" src="/assets/sponsors/stickergiant.png" alt="StickerGiant" width="185" height="118" loading="lazy" /></a></li>
            <li><a href="https://plasticworld.ca/" target="_blank" rel="noopener noreferrer"><img src="/assets/sponsors/plastic-world.png" alt="Plastic World" width="600" height="108" loading="lazy" /></a></li>
            <li><a href="https://3dprintingcanada.com/" target="_blank" rel="noopener noreferrer"><img src="/assets/sponsors/3d-printing-canada.webp" alt="3D Printing Canada" width="706" height="132" loading="lazy" /></a></li>
            <li><a href="https://www.panerabread.com/" target="_blank" rel="noopener noreferrer"><img class="sponsor-panera" src="/assets/sponsors/panera.png" alt="Panera Bread" width="480" height="358" loading="lazy" /></a></li>
            <li><a href="https://polymaker.com/" target="_blank" rel="noopener noreferrer"><img class="sponsor-symbol" src="/assets/sponsors/polymaker.png" alt="Polymaker" width="406" height="407" loading="lazy" /></a></li>
            <li><a href="https://us.misumi-ec.com/" target="_blank" rel="noopener noreferrer"><img src="/assets/sponsors/misumi.png" alt="MISUMI" width="516" height="124" loading="lazy" /></a></li>
            <li><a href="https://frctees.com/" target="_blank" rel="noopener noreferrer"><img src="/assets/sponsors/frctees.svg" alt="FRCtees" width="300" height="80" loading="lazy" /></a></li>
          </ul>
        </div>
      </section>
    </main>
    <footer>
      <div class="container footer-inner">
        <span>Gentoo Robotics &middot; FTC #37006</span>
        <div class="footer-links">
          <a class="contact-link" href="mailto:gentoo.37006@gmail.com">
            <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
              <rect x="2" y="4" width="20" height="16" rx="2" />
            </svg>
            <span>gentoo.37006@gmail.com</span>
          </a>
          <a class="contact-link" href="https://www.instagram.com/gentoo37006/" target="_blank" rel="noopener noreferrer" aria-label="Gentoo37006 on Instagram">
            <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
            </svg>
            <span>gentoo37006</span>
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
