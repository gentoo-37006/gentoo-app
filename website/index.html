<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Gentoo Robotics. FIRST Tech Challenge Team 37006. Meet our sponsors and access the team app." />
    <title>Gentoo Robotics</title>
    <link rel="icon" href="/team-icon.png" />
    <style>
      :root { color-scheme: light; --ink: #352d3f; --purple: #79599c; --lilac: #cbb0ed; --yellow: #ffe68b; --paper: #f0eaf3; }
      * { box-sizing: border-box; letter-spacing: 0; }
      html { background: var(--paper); color: var(--ink); scroll-behavior: smooth; }
      body { margin: 0; font-family: 'Trebuchet MS', Arial, sans-serif; border-top: 6px solid var(--yellow); }
      a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 5px; }
      a:hover { color: var(--purple); }
      a:focus-visible { outline: 3px solid var(--purple); outline-offset: 6px; }
      .container { width: min(100% - 48px, 1100px); margin-inline: auto; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-block: 23px; }
      .brand { font-weight: 800; font-size: 17px; text-decoration: none; }
      nav { display: flex; align-items: center; gap: 30px; font-size: 14px; font-weight: 700; }
      .hero { min-height: min(760px, 76svh); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 24px 64px; text-align: center; }
      .team-logo { width: 186px; height: 186px; object-fit: cover; border: 3px solid var(--ink); border-radius: 8px; box-shadow: 7px 7px 0 var(--lilac); }
      .team-number { margin: 27px 0 9px; font: bold 13px/1.5 ui-monospace, monospace; }
      h1 { font-family: 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif; font-size: 84px; font-style: italic; font-weight: 900; line-height: 1.1; margin: 0 0 13px; color: var(--lilac); -webkit-text-stroke: 2px var(--purple); text-shadow: 4px 5px 0 var(--purple), -3px -3px 0 var(--yellow); }
      .sponsors { background: var(--ink); color: #f8f3ff; border-top: 6px solid var(--lilac); padding: 49px 0 64px; text-align: center; }
      .sponsors h2 { margin: 0 0 12px; color: var(--yellow); font-size: 29px; }
      .sponsor-list { list-style: none; padding: 0; margin: 48px auto 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 43px 48px; max-width: 760px; }
      .sponsor-list li { min-height: 50px; display: flex; align-items: center; justify-content: center; font-size: 29px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
      .sponsor-list li:last-child { grid-column: 1 / -1; }
      footer { background: var(--ink); color: #d9cce6; }
      .footer-inner { border-top: 1px solid #665475; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 18px; padding-block: 24px; font-size: 13px; }
      .footer-links { display: flex; gap: 24px; flex-wrap: wrap; }
      .instagram-link { display: inline-flex; align-items: center; gap: 5px; }
      .instagram-icon { width: 16px; height: 16px; flex: none; }
      footer a:hover { color: var(--yellow); }
      @media (max-width: 600px) {
        .container { width: calc(100% - 36px); }
        header { gap: 16px; padding-block: 20px; }
        .brand { font-size: 15px; }
        nav { gap: 18px; font-size: 13px; }
        .hero { min-height: min(650px, 75svh); padding: 24px 18px 48px; }
        .team-logo { width: 154px; height: 154px; }
        h1 { font-size: 58px; -webkit-text-stroke-width: 1px; }
        .sponsors { padding-block: 37px 46px; }
        .sponsor-list { grid-template-columns: 1fr; gap: 28px; margin-top: 34px; }
        .sponsor-list li { font-size: 27px; }
      }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    </style>
  </head>
  <body>
    <header class="container">
      <a class="brand" href="/" aria-label="Gentoo Robotics home">Gentoo Robotics</a>
      <nav aria-label="Main navigation"><a href="#sponsors">Sponsors</a><a href="/app">Team App</a></nav>
    </header>
    <main id="main">
      <section class="hero" aria-labelledby="team-name">
        <img class="team-logo" src="/team-icon.png" alt="Gentoo team logo" width="186" height="186" fetchpriority="high" />
        <p class="team-number">FIRST TECH CHALLENGE / #37006</p>
        <h1 id="team-name">GENTOO</h1>
      </section>
      <section class="sponsors" id="sponsors" aria-labelledby="sponsors-title">
        <div class="container">
          <h2 id="sponsors-title">Our sponsors</h2>
          <ul class="sponsor-list" aria-label="Team sponsors">
            <li>StickerGiant</li><li>Plastic World</li><li>MISUMI</li><li>Polymaker</li>
            <li>Panera</li><li>3DP Canada</li><li>FRCtees</li>
          </ul>
        </div>
      </section>
    </main>
    <footer>
      <div class="container footer-inner">
        <span>Gentoo Robotics &middot; FTC #37006</span>
        <div class="footer-links">
          <a href="mailto:gentoo.37006@gmail.com">gentoo.37006@gmail.com</a>
          <a class="instagram-link" href="https://www.instagram.com/gentoo37006/" target="_blank" rel="noopener noreferrer" aria-label="Gentoo37006 on Instagram">
            <svg class="instagram-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
            </svg>
            <span>gentoo37006</span>
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
